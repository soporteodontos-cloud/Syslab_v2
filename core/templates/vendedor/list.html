{% extends "menu.html" %}
{% load tags %}
{% load static %}

{% block title %} Vendedores {% endblock %}


{% block content %}
    <link rel="stylesheet" href="{% static 'css/bootstrapt.css' %}">
    <link rel="stylesheet" href="{% static 'css/dataTables.bootstrap4.min.css' %}">
    <script src="{% static 'js/util.js' %}"></script>

    <div class="form-row">
        <form action="" method="get">
            <a class="btn btn-sm btn-success" href="{% url 'vendedor_create' %}"> Nuevo Vendedor </a>
        </form>
    </div>
    <br>
    <table id="asegurados" class="table table-striped table-bordered" style="width:100%" data-server-side="true">
      <thead>
        <tr>
          <th>Nombres</th>
          <th>Teléfono</th>
          <th>RUC</th>
          <th>DV</th>
          <th>Correo</th>
          <th>Creado Por</th>
          <th>Creado el</th>
          <th>realID</th>
          <th>Acciones</th>
        </tr>
      </thead>
    </table>

    <script src="{% static 'js/jquery-1.12.4.js' %}"></script>
  <script src="{% static 'js/jquery.dataTables.min.js' %}"></script>
  <script src="{% static 'js/dataTables.bootstrap4.min.js' %}"></script>
  <script>
      $(document).ready(function() {
          $('#asegurados').DataTable({
              "language": lenguaje,
              "serverSide": true,
              "ajax": '/rest/ven-list-intra/?format=datatables',
              columnDefs: [
                {
                    "targets": -1,
                    "orderable": false,
                    "searchable": false,
                },
                {
                    "targets": 7,
                    "visible": false
                },

              ],
              order: [[7, 'desc']],
              "columns": [
                  {'data': 'nombreApellido'},
                  {'data': 'telefono'},
                  {'data': 'ruc'},
                  {'data': 'dv'},
                  {'data': 'email'},
                  {'data': 'creado_por.username'},
                  {'data': 'creado_el'},
                  {'data': 'id'},
                  {'data': function ( row, type, val, meta ) {
                        return '<a type="button" href="/vendedor/update/'+row.id+'/" class="btn btn-warning btn-sm">Modificar</a> ' +
                            '<a type="button" href="/vendedor/delete/'+row.id+'/" class="btn btn-danger btn-sm">Borrar</a>';
                    }
                  },
                ],
          });
      });
  </script>
{% endblock %}
