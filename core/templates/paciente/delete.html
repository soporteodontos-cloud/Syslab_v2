{% extends "menu.html" %}
{% load tags %}
{% load static %}
{% load crispy_forms_tags %}
{% load bootstrap4 %}

{% block title %} Pacientes {% endblock %}

{% block content %}
    <div class="col-sm-12">
        <form id="formulario" method="post" class="form">
        {% csrf_token %}

            <h3>Esta seguro que desea borrar "{{ object }}" ?</h3>
            <br>
            {% buttons %}
                <button type="submit" class="btn btn-success">Borrar</button>
                <a class="btn btn-primary" href="{% url 'paciente_list' %}">Volver</a>
            {% endbuttons %}
        </form>
    </div>
 {% endblock %}
